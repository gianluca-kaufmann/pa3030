name: pa3030_env
channels:
  - conda-forge
  - nodefaults  # Optional: Prevents conflicts with the main Anaconda channel
dependencies:
  - python=3.12  # Pinned for stability
  - hazelbean
  - shap  # SHAP for model interpretability
  - imbalanced-learn  # For BalancedRandomForestClassifier
  - optuna  # Bayesian hyperparameter optimization

  - pip:
    # ACTUAL local development: points to the folder on your disk
    - "-e ../pa3030_dev"